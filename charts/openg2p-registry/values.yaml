idgenerator:
  enabled: true
  global:
    idGeneratorDB: '{{ printf "%s_idgenerator" .Release.Name | replace "-" "_" }}'
    idGeneratorDBUser: '{{ printf "%s_idgenerator_user" .Release.Name | replace "-" "_" }}'
    idGeneratorDBSecret: '{{ .Release.Name }}-idgenerator'
    idGeneratorDBUserPasswordKey: '{{ .Release.Name }}-idgenerator-db-user'
  postgres-init:
    enabled: true
    nameOverride: idgen-pg-init
  idGenerator:
    enabled: true
    appConfig:
      idTypes:
        farmer:
          idLength: 12
        household:
          idLength: 10
      sequenceLimit: 3
      repeatingLimit: 2
      repeatingBlockLimit: 2
      conjugativeEvenDigitsLimit: 3
      digitsGroupLimit: 5
      reverseDigitsGroupLimit: 5
      notStartWith: ["0", "1"]
      restrictedNumbers: []
      poolMinThreshold: 1000
      poolGenerationBatchSize: 5000
      poolCheckIntervalSeconds: 30
      exhaustionMaxAttempts: 1000
      subBatchSize: 10000
