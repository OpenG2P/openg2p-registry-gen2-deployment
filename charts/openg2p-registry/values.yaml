global:
  registryVariant: 'farmer'
  registryHostname: '{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'

  # Database
  postgresqlHost: commons-postgresql

  registryDB:  '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  masterDataDB: 'commons_services_master_data'
  masterDataDBPort: 5432
  masterDataDBUser: 'commons_services_master_data_user'
  masterDataDBSecret: 'commons-services-master-data'
  masterDataDBUserPasswordKey: 'commons-services-master-data-db-user'

  # Redis
  redisInstallationName: '{{ .Release.Name }}-redis-master'

  # Minio
  minioSecret: commons-minio
  minioAccessKey: root-user
  minioSecretKey: root-password
  minioHost: 'minio.{{ .Release.Namespace }}.openg2p.org'

  # Security & Authentication
  keymanagerInstallationName: commons-services-keymanager
  keycloakBaseUrl: 'https://keycloak.{{ .Release.Namespace }}.openg2p.org'
  keycloakRealm: 'staff'
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'

  registryKeymanagerAuthEnabled: false
  registryKeymanagerAppId: REGISTRY
  # OIDC client ID — must match the clientId in keycloak-init.realms
  authClientId: 'registry-staff-portal'
  # K8s Secret name holding the client password (created by keycloak-init)
  authClientSecret: 'registry-staff-portal'
  # Key inside the secret containing the client password
  authClientSecretKey: 'client_secret'

  # IAM service internal URL
  iamServiceUrl: 'http://commons-services-iam-staff-portal-api'

  # Master Data API internal URL
  masterDataApiUrl: 'http://commons-services-master-data-api'

  # AWE integration (shared staff realm; pairs with openg2p-awe release in namespace)
  aweEnabled: true
  aweBaseUrl: 'https://awe.{{ .Release.Namespace }}.openg2p.org'
  aweCallbackSecretId: 'registry'
  aweHttpTimeoutSeconds: 30
  aweWebhookTimestampToleranceSeconds: 300
  # K8s Secret for AWE webhook HMAC verification — created by postgres-init (see
  # postgres-init.databases) on first install, same pattern as registryDBSecret.
  aweCallbackHmacSecretName: 'registry-awe-callback-hmac'
  aweCallbackHmacSecretKey: 'hmac-secret'
  aweApproverUserPassword: 'Changeme123!'
  # AWE Postgres (separate service DB — seeded by implementation db-seed image, e.g. farmer-registry-db-seed)
  aweDB: 'awe'
  aweDBPort: 5432
  aweDBUser: 'awe_user'
  aweDBSecret: 'awe'
  aweDBUserPasswordKey: 'awe-db-user'
  # Helm release name of openg2p-awe (for post-install health wait)
  aweReleaseName: 'awe'

  # ID Generator
  idGeneratorHostname: 'idgenerator-{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'
  idGeneratorApiUrl: 'https://{{ tpl .Values.global.idGeneratorHostname $ }}/v1'

  # OpenG2P Audit Manager integration
  # Both `auditEnabled=true` AND `auditManagerUrl` must be set for emission
  # to actually happen. Defaults below mean "audit feature wired but turned
  # off" — safe to ship; per-environment overrides flip it on.
  # Available from staff-portal-api v1.1.x (chart 4.1.x).
  auditEnabled: true
  auditManagerUrl: 'http://commons-services-auditmanager:80'
  # Set to false to skip auditing of rejected anonymous calls (401/403
  # without a populated principal). Default true captures attempted
  # unauthorized access for security review.
  auditAnonymousFailures: true

# Logging — ships openg2p pod logs (as JSON) to the OpenSearch Output
# installed by openg2p-commons-base via Fluent Operator.
logging:
  enabled: true
  # Name of the namespace-scoped fluent Output resource (created by commons-base)
  # to which registry pod logs will be routed.
  outputRef: commons-opensearch
  # Container names whose logs should be captured by the Flow. Must match the
  # container names (i.e. component nameOverrides) in the deployments below.
  containerNames:
    - staff-portal-api
    - staff-portal-ui
    - partner-api
    - bene-portal-api
    - celery-beat-producer
    - celery-worker

# DB Seed — runs configuration and (optionally) sample data SQL scripts
# after all application pods are ready. Uses a Docker image published
# from openg2p-registry-gen2-extensions.
dbSeed:
  enabled: true
  # Load sample/demo data into the registry (disabled by default)
  loadSampleData: true
  image:
    repository: openg2p/openg2p-farmer-registry-db-seed
    tag: 1.0.3
    pullPolicy: Always

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.registryDB $ }}'
      user: '{{ tpl .Values.global.registryDBUser $ }}'
      secret: '{{ tpl .Values.global.registryDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
      extensions:
        - 'pg_trgm'
    # Re-run postgres-init against the registry DB to provision the AWE callback
    # HMAC secret (idempotent). Secret is referenced by staff-portal-api and db-seed.
    - name: '{{ tpl .Values.global.registryDB $ }}'
      user: '{{ tpl .Values.global.registryDBUser $ }}'
      secret: '{{ tpl .Values.global.aweCallbackHmacSecretName $ }}'
      secretUserPasswordKey: '{{ .Values.global.aweCallbackHmacSecretKey }}'

partnerApi:
  enabled: true
  nameOverride: partner-api
  hostname: 'partner-{{ tpl .Values.global.registryHostname $ }}'

  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-farmer-registry-partner-api
    tag: "1.0.2"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.partnerApi.hostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-partner-api'
      destinationPort: '{{ .Values.partnerApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.partnerApi.hostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    REGISTRY_PARTNER_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_PARTNER_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_PARTNER_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_PARTNER_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'
    REGISTRY_PARTNER_API_PORT: '{{ .Values.containerPort }}'

    REGISTRY_PARTNER_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    REGISTRY_CORE_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_CORE_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_CORE_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CORE_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CORE_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_PARTNER_API_KEYMANAGER_API_BASE_URL: "{{ .Values.global.keymanagerInstallationName }}/v1/keymanager"
    REGISTRY_PARTNER_API_KEYMANAGER_API_TIMEOUT: 10
    REGISTRY_PARTNER_API_KEYMANAGER_API_DOMAIN: "AUTH"
    REGISTRY_PARTNER_API_KEYMANAGER_SSL_VERIFY: False
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_ENABLED: '{{ .Values.global.registryKeymanagerAuthEnabled }}'
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    REGISTRY_PARTNER_API_KEYMANAGER_SIGN_APP_ID: '{{ .Values.global.registryKeymanagerAppId }}'
    REGISTRY_PARTNER_API_KEYMANAGER_SIGN_REF_ID: ""

    REGISTRY_PARTNER_API_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_PARTNER_API_MINIO_SECURE: "true"
    REGISTRY_PARTNER_API_MINIO_BUCKET_NAME: "templates"
  envVarsFrom:
    REGISTRY_PARTNER_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_CORE_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_PARTNER_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_PARTNER_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_PARTNER_API_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.authClientSecret $ }}'
        key: '{{ tpl .Values.global.authClientSecretKey $ }}'
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.authClientSecret $ }}'
        key: '{{ tpl .Values.global.authClientSecretKey $ }}'
  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_PARTNER_API_DB_USERNAME} -h ${REGISTRY_PARTNER_API_DB_HOSTNAME} -p ${REGISTRY_PARTNER_API_DB_PORT:-5432} -d ${REGISTRY_PARTNER_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

