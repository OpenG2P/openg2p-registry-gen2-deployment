staffPortalApi:
  enabled: true
  nameOverride: staff-portal-api
  hostname: 'staff-{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-farmer-registry-staff-portal-api
    tag: "1.0.2"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.staffPortalApi.hostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-staff-portal-api'
      destinationPort: '{{ .Values.staffPortalApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.staffPortalApi.hostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_STAFF_PORTAL_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_STAFF_PORTAL_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_STAFF_PORTAL_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_STAFF_PORTAL_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    REGISTRY_STAFF_PORTAL_API_AUTH_PROVIDER_API_URL: '{{ .Values.global.iamServiceUrl }}'
    REGISTRY_STAFF_PORTAL_API_KEYCLOAK_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_SECURE: "true"
    REGISTRY_STAFF_PORTAL_API_MINIO_BUCKET_NAME: "default"
    REGISTRY_STAFF_PORTAL_API_TEMPLATE_BUCKET_NAME: "template"

    # OpenG2P Audit Manager integration. No-op unless both AUDIT_ENABLED=true
    # and AUDIT_MANAGER_URL are set (controlled via global.auditEnabled and
    # global.auditManagerUrl). Safe to leave wired in older images that lack
    # the AuditMiddleware — env vars are simply ignored there.
    REGISTRY_STAFF_PORTAL_API_AUDIT_ENABLED: '{{ .Values.global.auditEnabled }}'
    REGISTRY_STAFF_PORTAL_API_AUDIT_MANAGER_URL: '{{ .Values.global.auditManagerUrl }}'
    REGISTRY_STAFF_PORTAL_API_AUDIT_ANONYMOUS_FAILURES: '{{ .Values.global.auditAnonymousFailures }}'

    # Maps to openg2p_registry_core.config.Settings (awe_*), via staff-portal prefix.
    REGISTRY_STAFF_PORTAL_API_AWE_ENABLED: '{{ .Values.global.aweEnabled }}'
    REGISTRY_STAFF_PORTAL_API_AWE_BASE_URL: '{{ tpl .Values.global.aweBaseUrl $ }}'
    REGISTRY_STAFF_PORTAL_API_AWE_HTTP_TIMEOUT_SECONDS: '{{ .Values.global.aweHttpTimeoutSeconds }}'
    REGISTRY_STAFF_PORTAL_API_AWE_DEFAULT_CALLBACK_URL: 'https://{{ tpl .Values.staffPortalApi.hostname $ }}/awe/webhooks/decision'
    REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_SECRET_ID: '{{ .Values.global.aweCallbackSecretId }}'
    REGISTRY_STAFF_PORTAL_API_AWE_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: '{{ .Values.global.aweWebhookTimestampToleranceSeconds }}'

  envVarsFrom:
    REGISTRY_STAFF_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_HMAC_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.aweCallbackHmacSecretName $ }}'
        key: '{{ .Values.global.aweCallbackHmacSecretKey }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_STAFF_PORTAL_API_DB_USERNAME} -h ${REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME} -p ${REGISTRY_STAFF_PORTAL_API_DB_PORT:-5432} -d ${REGISTRY_STAFF_PORTAL_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

staffPortalUi:
