        mode: SIMPLE
        credentialName: ""

  envVars:
    REGISTRY_BENE_PORTAL_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_BENE_PORTAL_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_BENE_PORTAL_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_BENE_PORTAL_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_BENE_PORTAL_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    REGISTRY_BENE_PORTAL_API_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_BENE_PORTAL_API_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    REGISTRY_BENE_PORTAL_API_MINIO_BUCKET_NAME: "templates"
  envVarsFrom:
    REGISTRY_BENE_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_BENE_PORTAL_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_BENE_PORTAL_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_BENE_PORTAL_API_DB_USERNAME} -h ${REGISTRY_BENE_PORTAL_API_DB_HOSTNAME} -p ${REGISTRY_BENE_PORTAL_API_DB_PORT:-5432} -d ${REGISTRY_BENE_PORTAL_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

  # Beneficiary Portal API is a FastAPI process serving the beneficiary
  # self-service portal. Workload profile mirrors Partner API: low
  # baseline, per-request bursts. Same envelope as Partner API (256Mi
  # requested / 768Mi limit) for predictability across the three API pods.
  # Disabled by default (enabled: false above) — sizing assumes it will
  # be turned on in production deployments that surface a beneficiary UI.
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 256Mi

# ---------------------------------------------------------------------------
# Agent Portal API — Phase-1 VC issuance. Reads the registry beneficiary_vc_view
# and pushes claims to Inji Certify (pre-authorized-code), then renders the PDF/QR.
# Image built from openg2p-registry-gen2-apis/agent-portal-api (tag g2p-4929).
# Requires Inji Certify reachable at certifyBaseUrl (deployed via commons-services).
# ---------------------------------------------------------------------------
agentPortalApi:
  enabled: false
  nameOverride: agent-portal-api
  # API host: agent-api.<registryHostname>. (The agent portal UI, when added,
  # takes agent.<registryHostname>.)
  hostname: 'agent-api.{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  # Built by the NSR docker pipeline (national-social-registry/docker/agent-portal-api).
  image:
    repository: openg2p/openg2p-nsr-agent-portal-api
    tag: "g2p-4929"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1000
  containerSecurityContext:
    enabled: false
    runAsUser: 1000
    runAsNonRoot: true

  openapiRootPath: /

  # Inji Certify base URL the API pushes to.
  certifyBaseUrl: 'http://commons-services-inji-certify/v1/certify'

  # ── VC definitions (module-owned, Helm-driven) ────────────────────────────
  # One entry per issuable VC type — supports MULTIPLE VCs per registry (e.g. an
  # ID card vs ID + socio-economic). Each entry has two parts:
  #   • API mapping  (config_id, credential_types, view, claim_columns) — passed
  #     to the Agent Portal API as REGISTRY_AGENT_PORTAL_API_VC_DEFINITIONS.
  #   • certifyConfig — the Certify credential_config registered via the
  #     credential-config-register Job (POST /credential-configurations).
  # The source `view` is created by the registry extension (deploys with models).
  vcIssuance:
    # Register credential_configs in Certify on install via the API.
    registerEnabled: true
    issuer:
      did: 'did:web:REPLACE-WITH-ISSUER-DID-HOST'
      keyManagerAppId: CERTIFY_VC_SIGN_ED25519
      keyManagerRefId: ED25519_SIGN
      signatureAlgo: EdDSA
      signatureCryptoSuite: Ed25519Signature2020
  vcDefinitions:
    - config_id: OpenG2PBeneficiaryCredential
      credential_types: ["VerifiableCredential", "OpenG2PBeneficiaryCredential"]
      view: beneficiary_vc_view
      claim_columns: ["functionalRecordId", "fullName", "dateOfBirth"]
      # Certify credential_config (POSTed to /credential-configurations).
      certifyConfig:
        credentialConfigKeyId: OpenG2PBeneficiaryCredential
        credentialFormat: ldp_vc
        credentialTypes: ["VerifiableCredential", "OpenG2PBeneficiaryCredential"]
        contextURLs: ["https://www.w3.org/2018/credentials/v1"]
        scope: openg2p_beneficiary_vc_ldp
        # base64 Velocity template (inline JSON-LD context; uses ${_issuer}).
        vcTemplate: ''
        displayOrder: ["functionalRecordId", "fullName", "dateOfBirth"]
        metaDataDisplay:
          - name: "OpenG2P Beneficiary Credential"
            locale: en
        credentialSubjectDefinition:
          functionalRecordId: { display: [{ name: "Functional Record ID", locale: en }] }
          fullName: { display: [{ name: "Full Name", locale: en }] }
          dateOfBirth: { display: [{ name: "Date of Birth", locale: en }] }
        qrSettings:
          - { "Full Name": "${fullName}", "Functional ID": "${functionalRecordId}", "Date Of Birth": "${dateOfBirth}" }
        qrSignatureAlgo: EdDSA

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ .Release.Name }}-agent-portal-api'
      destinationPort: '{{ .Values.agentPortalApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    REGISTRY_AGENT_PORTAL_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_AGENT_PORTAL_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_AGENT_PORTAL_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_AGENT_PORTAL_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'
    REGISTRY_AGENT_PORTAL_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'
    REGISTRY_AGENT_PORTAL_API_CERTIFY_BASE_URL: '{{ .Values.certifyBaseUrl }}'
    # JSON list of VC definitions (mapping fields only — Certify-side certifyConfig
    # is consumed by the registration Job, not the API).
    REGISTRY_AGENT_PORTAL_API_VC_DEFINITIONS: '{{ $o := list }}{{ range .Values.vcDefinitions }}{{ $o = append $o (dict "config_id" .config_id "credential_types" .credential_types "view" .view "claim_columns" .claim_columns) }}{{ end }}{{ $o | toJson }}'
  envVarsFrom:
    REGISTRY_AGENT_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_AGENT_PORTAL_API_DB_USERNAME} -h ${REGISTRY_AGENT_PORTAL_API_DB_HOSTNAME} -p ${REGISTRY_AGENT_PORTAL_API_DB_PORT:-5432} -d ${REGISTRY_AGENT_PORTAL_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 256Mi

staffPortalApi:
  enabled: true
  nameOverride: staff-portal-api
  hostname: 'staff-{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-farmer-registry-staff-portal-api
    tag: "1.0.2"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.staffPortalApi.hostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-staff-portal-api'
      destinationPort: '{{ .Values.staffPortalApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.staffPortalApi.hostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_STAFF_PORTAL_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_STAFF_PORTAL_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_STAFF_PORTAL_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_STAFF_PORTAL_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    REGISTRY_STAFF_PORTAL_API_AUTH_PROVIDER_API_URL: '{{ .Values.global.iamServiceUrl }}'
    REGISTRY_STAFF_PORTAL_API_KEYCLOAK_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_BUCKET_NAME: "{{ .Values.global.defaultBucketName }}"
    REGISTRY_STAFF_PORTAL_API_TEMPLATE_BUCKET_NAME: "{{ .Values.global.templateBucketName }}"

    # OpenG2P Audit Manager integration. No-op unless both AUDIT_ENABLED=true
    # and AUDIT_MANAGER_URL are set (controlled via global.auditEnabled and
    # global.auditManagerUrl). Safe to leave wired in older images that lack
    # the AuditMiddleware — env vars are simply ignored there.
    REGISTRY_STAFF_PORTAL_API_AUDIT_ENABLED: '{{ .Values.global.auditEnabled }}'
    REGISTRY_STAFF_PORTAL_API_AUDIT_MANAGER_URL: '{{ .Values.global.auditManagerUrl }}'
    REGISTRY_STAFF_PORTAL_API_AUDIT_ANONYMOUS_FAILURES: '{{ .Values.global.auditAnonymousFailures }}'

  envVarsFrom:
    REGISTRY_STAFF_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_STAFF_PORTAL_API_DB_USERNAME} -h ${REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME} -p ${REGISTRY_STAFF_PORTAL_API_DB_PORT:-5432} -d ${REGISTRY_STAFF_PORTAL_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

  # Staff Portal API is the primary read-write FastAPI for registry staff
  # operations — handles registrant CRUD, lookup, search, intake validation,
  # and MinIO pre-signed URL generation. Heavier than Partner API because
  # search/listing endpoints can return larger result sets and the entire
  # page of results is materialised as Python objects (typically 3-4x the
  # JSON size). Limit raised to 1Gi to absorb large listing spikes safely;
  # request 256Mi reflects steady-state baseline.
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 256Mi

staffPortalUi:
  enabled: true
  nameOverride: staff-portal-ui
  hostname: '{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-registry-staff-portal-ui
    tag: "1.0.2"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  containerPort: 3000

  # Staff Portal UI is a Next.js SSR app. Node + SSR rendering keeps RSS
  # around 200-300Mi steady-state but Node's V8 heap can balloon on cold
  # start (JIT warmup), large page pre-render, or many concurrent SSR
  # requests. 512Mi proved tight under load — raised limit to 1Gi which
  # matches typical Next.js production sizing. CPU is mostly idle between
  # user actions — 50m request is enough; bursts handled by un-capped limit.
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 256Mi

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.global.registryHostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-staff-portal-ui'
      destinationPort: '{{ .Values.service.port }}'
      prefix: '/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.global.registryHostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  # Configuration parameters
  partnerIngestUrl: 'https://partner-{{ tpl .Values.global.registryHostname $ }}/partner/ingest_data?data_model=dcivc'
  vpPresentationId: "7f3c2a91-bb84-4d1f-9a6e-41c8e5a0d9f2"
  vpPurpose: "Digital identity verification for registry onboarding"

  envVars:
    APP_MNEMONIC: registry-ui
    APP_URL: 'https://{{ tpl .Values.global.registryHostname $ }}'
    APPLICATION_MNEMONIC: 'registry-staff-portal'
    # Server-side calls from the Next.js Staff Portal UI pod to the Staff
    # Portal API stay inside the cluster — sibling K8s Service is named
    # "<release>-staff-portal-api" on port 80. Browser-side calls from the
    # client should use a separate NEXT_PUBLIC_* var pointing to the public
    # https://staff-<host> hostname (add when needed).
    BACKEND_API_URL: 'http://{{ .Release.Name }}-staff-portal-api'
    COOKIE_DOMAIN: '.{{ .Release.Namespace }}.openg2p.org'
    IAM_URL: '{{ .Values.global.iamServiceUrl }}'
    KEYCLOAK_LOGOUT_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/logout'
    LOGIN_PROVIDER_ID: '1'
    MASTERDATA_BACKEND_API_URL: '{{ .Values.global.masterDataApiUrl }}'
    NODE_ENV: production
    PAGE_SIZE: '10'
    PARTNER_IMPORT_EXPORT_ENABLE: 'true'
    PARTNER_INGEST_URL: '{{ tpl .Values.partnerIngestUrl $ }}'
    REDIRECT_URL: 'https://{{ tpl .Values.global.registryHostname $ }}'
    VERIFY_SERVICE_URL: 'https://{{ tpl .Values.global.registryHostname $ }}/v1/verify'
    VP_CLIENT_ID: 'did:web:{{ tpl .Values.global.registryHostname $ }}:v1:verify'
    VP_PRESENTATION_ID: '{{ .Values.vpPresentationId }}'
    VP_PURPOSE: '{{ .Values.vpPurpose }}'

  envVarsFrom: {}

  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

celeryBeatProducer:
  enabled: true
  nameOverride: celery-beat-producer
  replicaCount: 1
  image:
    repository: openg2p/openg2p-farmer-registry-celery
    tag: "1.0.2"
    pullPolicy: Always

  # Celery Beat Producer is NOT just a scheduler in this chart — it also
  # does batch enqueueing (REGISTRY_CELERY_BEAT_BATCH_SIZE=2000,
  # NO_OF_TASKS_TO_PROCESS=4 above). Each tick pulls up to 2000 records,
  # holds them in memory while creating up to 4 parallel task envelopes,
  # and dispatches to Redis. Python record objects + SQLAlchemy session +
  # Celery imports easily exceed 256Mi under load — observed OOM at that
  # limit. 768Mi gives ~3x headroom over a fully-loaded tick. Lower the
  # BATCH_SIZE or NO_OF_TASKS_TO_PROCESS knobs if you need to shrink this.
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 20m
      memory: 256Mi

  envVars:
    REGISTRY_CELERY_BEAT_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_BEAT_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_CELERY_BEAT_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CELERY_BEAT_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_CELERY_BEAT_CELERY_BROKER_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0
    REGISTRY_CELERY_BEAT_CELERY_BACKEND_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0

    REGISTRY_CELERY_BEAT_WORKER_QUEUE: registry_worker_queue
    REGISTRY_CELERY_BEAT_BATCH_SIZE: 2000
    REGISTRY_CELERY_BEAT_NO_OF_TASKS_TO_PROCESS: 4

    REGISTRY_CELERY_BEAT_DATA_TRANSFORMATION_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_INGEST_DATA_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_INGEST_DATA_CLASSIFICATION_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_OUTGEST_DATA_PUBLISH_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_OUTGEST_TOPIC_REGISTER_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_DEDUPLICATION_BEAT_PRODUCER_FREQUENCY: 30
    CELERY_APP: "openg2p_registry_celery_beat_producers.main.celery_app"
    CELERY_OPTS: "worker --beat --loglevel=info --schedule=/tmp/celery-beat-schedule.db"

  envVarsFrom:
    REGISTRY_CELERY_BEAT_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${REGISTRY_CELERY_BEAT_DB_USERNAME}
      -h ${REGISTRY_CELERY_BEAT_DB_HOSTNAME}
      -p ${REGISTRY_CELERY_BEAT_DB_PORT:-5432}
      -d ${REGISTRY_CELERY_BEAT_DB_DBNAME:-registrydb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false

  serviceAccount:
    create: false
    name: ""

celeryWorker:
  enabled: true
  nameOverride: celery-worker
  replicaCount: 1
  image:
    repository: openg2p/openg2p-farmer-registry-celery
    tag: "1.0.2"
    pullPolicy: Always

  # Celery Worker is the largest variable-load component in the chart. It
  # processes async tasks (bulk partner ingest, data transformation,
  # classification) — RSS can sit at ~200Mi idle but spike well past 1Gi
  # when crunching large CSV ingests or running classification on big
  # batches. Limit at 1.5Gi gives headroom for the worst observed peak
  # plus the same per-tick batch shape as the beat producer; request
  # 768Mi reserves enough that the scheduler doesn't over-pack workers
  # onto a node. CPU request 100m (10% core) reflects active processing
  # baseline; bursts allowed up to node capacity. If workloads grow,
  # prefer horizontal scaling (replicaCount) before raising per-pod limits.
  resources:
    limits:
      memory: 1.5Gi
    requests:
      cpu: 100m
      memory: 768Mi

  envVars:
    REGISTRY_CELERY_WORKERS_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_WORKERS_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_CELERY_WORKERS_DB_PORT: 5432
    REGISTRY_CELERY_WORKERS_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_CELERY_WORKERS_CELERY_BROKER_URL: "redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0"
    REGISTRY_CELERY_WORKERS_CELERY_BACKEND_URL: "redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0"
    REGISTRY_CELERY_WORKERS_WORKER_QUEUE: "registry_worker_queue"

    REGISTRY_CELERY_WORKERS_BATCH_SIZE: 2000
    REGISTRY_CELERY_WORKERS_WORKER_MAX_ATTEMPTS: 5

    REGISTRY_CELERY_WORKERS_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    REGISTRY_CELERY_WORKERS_MINIO_BUCKET_NAME: "{{ .Values.global.defaultBucketName }}"
    REGISTRY_CELERY_WORKERS_TEMPLATE_BUCKET_NAME: "{{ .Values.global.templateBucketName }}"
    REGISTRY_CELERY_WORKERS_FUNCTIONAL_ID_GENERATION_URL: '{{ tpl .Values.global.idGeneratorInternalUrl $ }}'
    REGISTRY_CELERY_WORKERS_ID_GENERATION_ALLOCATION_PATH: '/idgenerator/{id_type}/id'
    CELERY_APP: "openg2p_registry_celery_workers.main.celery_app"
    CELERY_OPTS: "worker -Q registry_worker_queue --loglevel=info"

  envVarsFrom:
    REGISTRY_CELERY_WORKERS_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_CELERY_WORKERS_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${REGISTRY_CELERY_WORKERS_DB_USERNAME}
      -h ${REGISTRY_CELERY_WORKERS_DB_HOSTNAME}
      -p ${REGISTRY_CELERY_WORKERS_DB_PORT:-5432}
      -d ${REGISTRY_CELERY_WORKERS_DB_DBNAME:-registrydb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false

  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true
  serviceAccount:
    create: false
    name: ""

redis:
  enabled: true
  architecture: standalone
  master:
    persistence:
      enabled: false
  auth:
    enabled: false

keycloak-init:
  enabled: true
  keycloak:
    # Internal URL to reach Keycloak within the namespace
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    # Points to the Keycloak chart's auto-created admin secret (<commons-release-name>-keycloak)
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  suffix: '{{ .Release.Namespace }}'
  realms:
    staff:
      clients:
        - clientId: registry-staff-portal
          name: Registry Staff Portal
          # Host-scoped redirect URIs — restricted to the Staff Portal UI's
          # public hostname. Covers all paths under it (root, OIDC callback,
          # post-login landing). NEVER use a bare "*" — it allows token
          # redirects to arbitrary hosts and is a known OIDC vulnerability.
          redirectUris:
            - 'https://{{ tpl .Values.global.registryHostname $ }}/*'
          clientRoles:
            # --- Operations roles ---
            - "Intake Officer"
            - "Intake Validator"
            - "Data Editor"
            - "Data Validator"
            - "Data Supervisor"
            - "Integration Manager"
            - "Operations Administrator"
            # --- Configuration roles ---
            - "Schema Designer"
            - "Integration Specialist"
            - "Reference Data Specialist"
            - "Technical Administrator"
      users:
        # IMPORTANT: It is assumed that admin has already been created as part
        # of commons layer
        - username: admin
          clientRoleMappings:
            registry-staff-portal:
              - "Operations Administrator"
              - "Technical Administrator"

idgenerator:
  enabled: true
  global:
    idGeneratorDB: '{{ printf "%s_idgenerator" .Release.Name | replace "-" "_" }}'
    idGeneratorDBUser: '{{ printf "%s_idgenerator_user" .Release.Name | replace "-" "_" }}'
    idGeneratorDBSecret: '{{ .Release.Name }}-idgenerator'
    idGeneratorDBUserPasswordKey: '{{ .Release.Name }}-idgenerator-db-user'
  postgres-init:
    enabled: true
    nameOverride: idgen-pg-init
  idGenerator:
    enabled: true
    appConfig:
      idTypes:
        farmer:
          idLength: 12
        household:
          idLength: 10
      sequenceLimit: 3
      repeatingLimit: 2
      repeatingBlockLimit: 2
      conjugativeEvenDigitsLimit: 3
      digitsGroupLimit: 5
      reverseDigitsGroupLimit: 5
      notStartWith: ["0", "1"]
      restrictedNumbers: []
      poolMinThreshold: 1000
      poolGenerationBatchSize: 5000
      poolCheckIntervalSeconds: 30
      exhaustionMaxAttempts: 1000
      subBatchSize: 10000
