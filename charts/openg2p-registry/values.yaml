global:
  registryHostname: farmer-registry-gen2.play.openg2p.org

  # Database
  postgresqlHost: commons-postgresql

  registryDB: '{{ .Release.Name }}_db'
  registryDBPort: 5432
  registryDBUser: '{{ .Release.Name }}_db_user'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}_db_user'

  masterDataReleaseName: master-data
  masterDataDB: '{{ .Values.global.masterDataReleaseName }}_db'
  masterDataDBPort: 5432
  masterDataDBUser: '{{ .Values.global.masterDataReleaseName }}_db_user'
  masterDataDBSecret: '{{ .Values.global.masterDataReleaseName }}'
  masterDataDBUserPasswordKey: '{{ .Values.global.masterDataReleaseName }}_db_user'


  # Redis
  redisInstallationName: '{{ .Release.Name }}-redis-master'
  
  # Minio
  minioInstallationName: commons-minio
  minioAccessKey: root-user
  minioSecretKey: root-password
    
  # Security & Authentication
  keymanagerInstallationName: commons-keymanager
  keycloakBaseUrl: https://keycloak.openg2p.org
  keycloakIssuerUrl: '{{ .Values.global.keycloakBaseUrl }}/realms/master'
  
  registryKeymanagerAuthEnabled: false
  registryKeymanagerAppId: REGISTRY
  registryAuthClientId: 'openg2p-registry-{{ .Release.Namespace }}'
  registryAuthClientSecret: ''

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.registryDB $ }}'
      user: '{{ tpl .Values.global.registryDBUser $ }}'
      secret: '{{ tpl .Values.global.registryDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
      extensions:
        - 'pg_trgm'

partnerApi:
  enabled: true
  nameOverride: partner-api
  hostname: 'partner-{{ tpl .Values.global.registryHostname $ }}'

  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: tahzeer/openg2p-registry-partner-api
    tag: "farmer"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true
  
  openapiRootPath: /
  
  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.partnerApi.hostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-partner-api'
      destinationPort: '{{ .Values.partnerApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.partnerApi.hostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""
  
  envVars:
    REGISTRY_PARTNER_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_PARTNER_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_PARTNER_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_PARTNER_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'
    REGISTRY_PARTNER_API_PORT: '{{ .Values.containerPort }}'

    REGISTRY_PARTNER_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    REGISTRY_CORE_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_CORE_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_CORE_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CORE_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CORE_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'
    
    REGISTRY_PARTNER_API_KEYMANAGER_API_BASE_URL: "{{ .Values.global.keymanagerInstallationName }}/v1/keymanager"
    REGISTRY_PARTNER_API_KEYMANAGER_API_TIMEOUT: 10
    REGISTRY_PARTNER_API_KEYMANAGER_API_DOMAIN: "AUTH"
    REGISTRY_PARTNER_API_KEYMANAGER_SSL_VERIFY: False
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_ENABLED: '{{ .Values.global.registryKeymanagerAuthEnabled }}'
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_CLIENT_ID: '{{ tpl .Values.global.registryAuthClientId $ }}'
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_CLIENT_SECRET: '{{ .Values.global.registryAuthClientSecret }}'
    REGISTRY_PARTNER_API_KEYMANAGER_SIGN_APP_ID: '{{ .Values.global.registryKeymanagerAppId }}'
    REGISTRY_PARTNER_API_KEYMANAGER_SIGN_REF_ID: ""

    REGISTRY_PARTNER_API_MINIO_ENDPOINT: "{{ .Values.global.minioInstallationName }}:9000"
    REGISTRY_PARTNER_API_MINIO_SECURE: "false"
    REGISTRY_PARTNER_API_MINIO_BUCKET_NAME: "templates"
  envVarsFrom:
    REGISTRY_PARTNER_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_CORE_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_PARTNER_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioInstallationName $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_PARTNER_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioInstallationName $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  
  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_PARTNER_API_DB_USERNAME} -h ${REGISTRY_PARTNER_API_DB_HOSTNAME} -p ${REGISTRY_PARTNER_API_DB_PORT:-5432} -d ${REGISTRY_PARTNER_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  postgresqlInstallationName: '{{ .Release.Name }}-postgresql'
  containerPort: 8000

