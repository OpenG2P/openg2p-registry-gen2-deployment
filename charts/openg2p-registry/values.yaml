  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
