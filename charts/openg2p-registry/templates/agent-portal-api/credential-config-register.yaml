{{- if and .Values.agentPortalApi.enabled .Values.agentPortalApi.vcIssuance.registerEnabled }}
{{- /* Issuer is env-level (set at Certify install), not module-owned. */}}
{{- $iss := .Values.global.vcIssuer -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-agent-vc-configs
  labels:
    app.kubernetes.io/name: agent-vc-config-register
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
data:
{{- range .Values.agentPortalApi.vcDefinitions }}
  {{- $cc := deepCopy .certifyConfig }}
  {{- /* Author the Velocity template as readable JSON (vcTemplateJson); Certify
         stores/decodes it as base64, so base64-encode it here. */}}
  {{- if hasKey $cc "vcTemplateJson" }}
    {{- $_ := set $cc "vcTemplate" (trim (get $cc "vcTemplateJson") | b64enc) }}
    {{- $_ := unset $cc "vcTemplateJson" }}
  {{- end }}
  {{- /* Merge env-level issuer (DID + signing key) into each credential_config */}}
  {{- $body := mergeOverwrite $cc (dict "didUrl" $iss.did "keyManagerAppId" $iss.keyManagerAppId "keyManagerRefId" $iss.keyManagerRefId "signatureAlgo" $iss.signatureAlgo "signatureCryptoSuite" $iss.signatureCryptoSuite) }}
  {{ .config_id }}.json: |-
{{ $body | toJson | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-agent-vc-register
  labels:
    app.kubernetes.io/name: agent-vc-config-register
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Register the module's credential_configs in Certify (which Certify needs
    # before the Agent Portal API can push to them). Runs after install/upgrade.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-vc-config-register
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: register
          image: curlimages/curl:8.11.0
          env:
            - name: CERTIFY_BASE_URL
              value: {{ .Values.agentPortalApi.certifyBaseUrl | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for f in /configs/*.json; do
                id=$(basename "$f" .json)
                echo "Registering credential_config '$id' ..."
                code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST \
                  -H "Content-Type: application/json" \
                  --data @"$f" "$CERTIFY_BASE_URL/credential-configurations" || true)
                echo "  POST -> $code"
                # Already exists (Certify returns 4xx on duplicate) -> update via PUT.
                if [ "$code" != "201" ] && [ "$code" != "200" ]; then
                  echo "  exists/failed; trying PUT /$id"
                  curl -s -o /tmp/resp -w "  PUT -> %{http_code}\n" -X PUT \
                    -H "Content-Type: application/json" \
                    --data @"$f" "$CERTIFY_BASE_URL/credential-configurations/$id" || true
                  cat /tmp/resp; echo
                fi
              done
              echo "Credential config registration done."
          volumeMounts:
            - name: configs
              mountPath: /configs
              readOnly: true
      volumes:
        - name: configs
          configMap:
            name: {{ .Release.Name }}-agent-vc-configs
{{- end }}
